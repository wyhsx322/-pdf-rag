[project]
name = "ai-research-paper-writing-assistant"
version = "0.1.0"
description = "Local AI research paper writing assistant with PDF RAG, evidence retrieval, and citation-aware drafting."
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "jieba>=0.42.1",
    "langchain>=1.2.15",
    "langchain-deepseek>=1.0.1",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "marker-pdf==1.6.1",
    "modelscope>=1.37.0",
    "notebook>=7.5.5",
    "openai>=2.32.0",
    "pymilvus[milvus-lite]>=3.0.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=4.0.2",
    "torch>=2.5.0",
    "transformers<4.50",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
